# Copy to .github/workflows/Release.yaml of an Alixea set (alixea-erp/alixea-generic, alixea-erp/alixea-finance), on
# every series branch: a push runs the workflow of the pushed branch. A push to a series branch is a release: the
# pushed commit is tagged <series>/<date>, such as 19.0/20261116, a second one of the day 19.0/20261116.1, and its
# modules are uploaded. A push that changes no module releases nothing. "Run workflow" releases the newest commit of
# the series picked, which is also the way to try again after a failed upload. A series without modules releases
# nothing.
#
# The archive holds the modules' Python as bytecode for Alixea's Odoo image of the series, not the source. Before the
# upload every module is installed once on a throwaway database, those that need Enterprise with its newest version.
# A module that fails stops the release, and the run's summary says which one and why. "Run workflow" with "Skip
# check" releases without that, when a person decides so. With the organisation secret
# SLACK_ODOO_RELEASES_WEBHOOK_URL, Slack says when a version is ready to approve, and when one was stopped.
name: Release

on:
  push:
    branches: ['18.0', '19.0', '20.0']
    paths-ignore:
      - '.github/**'
      - '.cursor/**'
      - 'docs/**'
      - 'scripts/**'
      - '*.md'
      - '*.yml'
      - '.git*'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      series:
        type: choice
        options: ['18.0', '19.0', '20.0']
        default: '19.0'
        required: true
      skip_check:
        description: Skip check. Releases without installing the modules first
        type: boolean
        default: false

jobs:
  release:
    name: ${{ inputs.series || github.ref_name }}
    # NOTE! Only in Alixea's organisation: the file is the same in a copy of the repository elsewhere, which has
    # no right to upload
    if: github.repository_owner == 'alixea-erp'
    # NOTE! An ARM runner: the build and the install check run Alixea's Odoo image, which is arm64
    runs-on: ubuntu-24.04-arm
    # Two releases of one series run one after the other, so each gets a tag of its own
    concurrency:
      group: release-${{ inputs.series || github.ref_name }}
    permissions:
      contents: write
      id-token: write
    env:
      # A push has no input, its series is the pushed branch
      SERIES: ${{ inputs.series || github.ref_name }}

    steps:
      # A run again after a failed upload finds its own tag. Another commit of the same day gets .1, .2, ...
      - name: Tag the commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push releases the pushed commit, a run by hand the newest one of the series branch
          commit=$GITHUB_SHA
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SERIES" --jq .sha)
            modules=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$commit?recursive=1" --jq '[.tree[].path | select(endswith("__manifest__.py"))] | length')
            if [ "$modules" = 0 ]; then
              echo "::notice::$SERIES has no modules, nothing to release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          tag="$SERIES/$(date -u +%Y%m%d)"
          suffix=0
          while existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$tag" --jq .sha 2>/dev/null) && [ -n "$existing" ]; do
            [ "$existing" = "$commit" ] && break
            suffix=$((suffix + 1))
            tag="$SERIES/$(date -u +%Y%m%d).$suffix"
          done
          if [ "$existing" != "$commit" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$commit" > /dev/null
          fi
          echo "$SERIES at ${commit:0:7} is \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.tag.outputs.skip != 'true'
        id: release
        uses: alixea-erp/action-module-set@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          build: true
          check: ${{ inputs.skip_check != true }}
          check-with: alixea-erp/odoo-enterprise

      - name: Tell Slack it is ready
        if: steps.tag.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ODOO_RELEASES_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
          CHECK: ${{ steps.release.outputs.check || 'The install check was skipped.' }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "::notice::Slack was not told: this repository cannot read the secret SLACK_ODOO_RELEASES_WEBHOOK_URL"; exit 0; }
          text="${GITHUB_REPOSITORY#*/} is released as $TAG. $CHECK Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Try it on a test deployment, then approve it on the admin Updates page."
          jq -n --arg text "$text" '{text: $text}' | curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ODOO_RELEASES_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "::notice::Slack was not told: this repository cannot read the secret SLACK_ODOO_RELEASES_WEBHOOK_URL"; exit 0; }
          text="The release of ${GITHUB_REPOSITORY#*/} $SERIES failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Fix it, then run Release by hand for $SERIES."
          # The action leaves this file when the install check stopped the release
          if [ -f module-check-out/blocked.txt ]; then
            text="${GITHUB_REPOSITORY#*/} $SERIES was not released, the install check stopped it: $(cat module-check-out/blocked.txt) Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Fix it and release again, or run Release by hand for $SERIES with Skip check."
          fi
          jq -n --arg text "$text" '{text: $text}' | curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
